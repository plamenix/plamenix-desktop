# Builds installable Plamenix desktop binaries and attaches them to a
# GitHub Release.
#
# ## Why this file is more than `tauri build`
#
# Plamenix is a polyrepo. `plamenix-desktop` reaches its siblings by
# relative path — `link:../plamenix-ui` in package.json, and eight Cargo
# `path` dependencies into `../../plamenix-core` including the vendored
# `rsfbclient-native`. A runner that checks out this repo alone cannot
# resolve any of them, so the first job of this workflow is to rebuild
# the directory layout a developer has locally:
#
#     <workspace>/
#       plamenix-core/
#       plamenix-ui/
#       plamenix-desktop/     <- this repo
#
# While the sibling repositories are private, that cross-repo checkout
# needs a token with read access to them; `GITHUB_TOKEN` is scoped to
# this repository only and will 404 on the others. Create a fine-grained
# PAT with `contents: read` on plamenix-core and plamenix-ui and store
# it as the `SIBLING_REPOS_TOKEN` secret. Once the repositories are
# public the secret can be deleted and the checkouts keep working.
#
# ## Signing
#
# Both signing blocks are keyed off secrets and are skipped when those
# secrets are absent, so this workflow produces working unsigned builds
# on day one. Unsigned is not cosmetic: macOS reports "cannot be opened
# because the developer cannot be verified" and Windows shows a
# SmartScreen warning. Add the secrets when there is a certificate to
# add; nothing else here changes.

name: Release

on:
  push:
    tags:
      # Matches `1.0.0-beta` as well as `1.0.0`. Deliberately narrow, so
      # a docs or scratch tag cannot start a two-hour matrix build.
      - '[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+-*'
  # Lets a release be rebuilt without moving the tag.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build (e.g. 1.0.0-beta)'
        required: true
        type: string

# One release build at a time. Two runs racing to attach assets to the
# same release is how half-populated releases happen.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      # Every platform that can finish should finish. A Windows failure
      # is no reason to withhold a working macOS build.
      fail-fast: false
      matrix:
        include:
          - label: macOS (Apple Silicon)
            os: macos-14
            rust-target: aarch64-apple-darwin
            tauri-args: --target aarch64-apple-darwin
          # Cross-compiled from the Apple Silicon runner. GitHub has
          # retired the macos-13 Intel image, so a job asking for it
          # queues until it times out rather than failing — which is
          # exactly what happened, silently, on every run. `FB_ARCH`
          # tells the fbclient script which architecture is being built
          # for, since it otherwise reads the host's.
          - label: macOS (Intel)
            os: macos-14
            rust-target: x86_64-apple-darwin
            fb-arch: x86_64
            tauri-args: --target x86_64-apple-darwin
          # 22.04, not latest: Tauri 2 links against webkit2gtk-4.1, and
          # the produced binary's glibc requirement is that of the build
          # host. Building on the oldest supported runner is what makes
          # the AppImage usable on anything older than the runner.
          - label: Linux (x86_64)
            os: ubuntu-22.04
            rust-target: x86_64-unknown-linux-gnu
            # .deb and .rpm only here. The AppImage is attempted
            # separately below, because it is the one format that has
            # failed repeatedly and it must not be able to take the
            # other two down with it.
            tauri-args: --bundles deb,rpm
          - label: Windows (x86_64)
            os: windows-latest
            rust-target: x86_64-pc-windows-msvc
            # NSIS only. The MSI format requires any pre-release
            # identifier to be numeric and <= 65535, so `1.0.0-beta`
            # cannot build one at all -- "beta" is not a number. The
            # `-setup.exe` installer carries the same payload.
            tauri-args: --bundles nsis

    steps:
      - name: Check out plamenix-desktop
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          path: plamenix-desktop

      # The sibling checkouts. Same ref as this repo: the repositories
      # are tagged together, so `1.0.0-beta` means the same commit set
      # across all three. A missing tag here fails loudly, which is
      # correct — building a release against sibling `main` would
      # produce a binary that matches no tag.
      - name: Check out plamenix-core
        uses: actions/checkout@v4
        with:
          repository: plamenix/plamenix-core
          ref: ${{ inputs.tag || github.ref_name }}
          token: ${{ secrets.SIBLING_REPOS_TOKEN || github.token }}
          path: plamenix-core

      - name: Check out plamenix-ui
        uses: actions/checkout@v4
        with:
          repository: plamenix/plamenix-ui
          ref: ${{ inputs.tag || github.ref_name }}
          token: ${{ secrets.SIBLING_REPOS_TOKEN || github.token }}
          path: plamenix-ui

      # `libfuse2` is not optional despite looking it: `linuxdeploy`,
      # which Tauri downloads to build the AppImage, is itself an
      # AppImage and needs FUSE to mount itself. Without it the bundle
      # step reports only "failed to run linuxdeploy" — .deb and .rpm
      # build fine, which makes it look like an AppImage-specific bug
      # rather than a missing library.
      - name: Install Linux build dependencies
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libfuse2 \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            build-essential \
            file \
            wget

      - name: Set up Rust ${{ matrix.rust-target }}
        uses: dtolnay/rust-toolchain@master
        with:
          # Matches plamenix-core/rust-toolchain.toml. Pinned rather than
          # `stable`, so a new release of Rust cannot break a release
          # build on a day nobody touched the code.
          toolchain: '1.95'
          targets: ${{ matrix.rust-target }}

      - name: Cache cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: plamenix-desktop/src-tauri -> target
          key: ${{ matrix.rust-target }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '10.0.0'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: plamenix-desktop/pnpm-lock.yaml

      # `link:../plamenix-ui` resolves to this repo's source tree, and
      # the desktop build imports its built `dist`. Nothing else builds
      # it for us, so it happens here, before the Tauri build runs.
      - name: Build @plamenix/ui
        working-directory: plamenix-ui
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      # `resources/fbclient/` is gitignored, so it does not exist on a
      # fresh checkout and `tauri build` fails on the missing bundle
      # resource. The script's own header says the release pipeline is
      # expected to run it once per platform; nothing was.
      - name: Ensure unzip is available
        if: startsWith(matrix.os, 'windows')
        shell: bash
        run: command -v unzip >/dev/null || choco install unzip -y --no-progress

      - name: Fetch the bundled Firebird client
        working-directory: plamenix-desktop
        shell: bash
        env:
          FB_ARCH: ${{ matrix.fb-arch }}
        run: ./scripts/fetch-fbclient.sh

      - name: Install desktop dependencies
        working-directory: plamenix-desktop
        run: pnpm install --frozen-lockfile

      - name: Build and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # Runs `linuxdeploy` and its plugins by extracting them rather
          # than mounting them. They are AppImages, and mounting needs
          # FUSE, which a runner may or may not provide in a usable
          # state — installing `libfuse2` alone did not fix it, and the
          # failure surfaces only as "failed to run linuxdeploy" with no
          # cause. Extraction removes the dependency instead of betting
          # on it. Ignored on non-Linux jobs.
          APPIMAGE_EXTRACT_AND_RUN: 1
          # `linuxdeploy-plugin-appimage` shells out to `appimagetool`,
          # which refuses to run without `ARCH` and whose complaint
          # Tauri swallows — the bundle step reports only "failed to run
          # linuxdeploy" with no cause, sixteen seconds after starting.
          # Harmless on the other jobs, and the fbclient script assigns
          # its own ARCH so this cannot reach it.
          ARCH: x86_64
          # linuxdeploy's strip step is built against an older binutils
          # than the runner ships and fails on binaries it produced
          # itself. Nothing here depends on a stripped AppImage.
          NO_STRIP: true
          # Signing variables are deliberately absent.
          #
          # An unset secret expands to the empty string rather than to
          # nothing, so passing `APPLE_CERTIFICATE: ${{ secrets.X }}`
          # with no certificate configured sets the variable to "" —
          # which tauri-action reads as "sign this build" and then fails
          # on `security import` with nothing to import. Omitting them
          # is what actually produces an unsigned build.
          #
          # To sign: add the certificate secrets and reinstate the
          # APPLE_* / TAURI_SIGNING_* variables here in one commit. Do
          # not add them speculatively — an empty one is worse than none.
        with:
          projectPath: plamenix-desktop
          tagName: ${{ inputs.tag || github.ref_name }}
          releaseName: 'Plamenix ${{ inputs.tag || github.ref_name }}'
          releaseBody: |
            Open-source IDE for Firebird 2.5–5.0.

            **This is a beta.** The core loop — connect, browse schema,
            run SQL, edit rows — works and is covered by tests. The
            surfaces around it are newer. Issues are welcome and useful.

            ### Installing

            | Platform | File |
            |---|---|
            | macOS (Apple Silicon) | `*_aarch64.dmg` |
            | macOS (Intel) | `*_x64.dmg` |
            | Linux | `*.AppImage` or `*.deb` |
            | Windows | `*-setup.exe` or `*.msi` |

            ### On macOS and Windows, consider building from source

            These builds are **not code-signed**. macOS will say the
            developer cannot be verified and Windows will show a
            SmartScreen warning — and those warnings are correct.
            Nothing has vouched for these binaries.

            They are produced by GitHub Actions from the tagged commit,
            not uploaded from anyone's laptop, and the workflow is in
            the repository. That is verifiable, but it is not the same
            as a signature. Signing certificates cost money the project
            does not have yet.

            [Building from source](https://github.com/plamenix/plamenix/blob/main/docs/build-prerequisites.md)
            is mostly unattended — the first build compiles the full
            Rust dependency tree, and every build after that is
            incremental.

            If you would rather use the installers: on macOS,
            right-click the app and choose Open. On Windows, choose
            More info, then Run anyway. Linux packages are unaffected.

            Firebird's client library is loaded at runtime, so no
            separate `fbclient` install is needed for the default
            pure-Rust connection mode.
          # Kept as a draft so the release can be checked before it is
          # visible, and so a platform that fails does not publish a
          # release missing its binaries.
          releaseDraft: true
          prerelease: true
          args: ${{ matrix.tauri-args }}

      # Best-effort, and deliberately last.
      #
      # `tauri build` bundles formats in one pass and aborts the whole
      # command on the first failure, so an AppImage that will not build
      # discards the .deb and .rpm that already did — which is exactly
      # what happened: both bundled successfully, then the job failed
      # and uploaded nothing.
      #
      # linuxdeploy fails here with a bare "failed to run linuxdeploy"
      # and Tauri swallows its stderr, so there is nothing to diagnose
      # from. Until that is understood, the AppImage is allowed to fail
      # without costing the release its Linux packages.
      - name: Build the AppImage (best-effort)
        if: startsWith(matrix.os, 'ubuntu')
        continue-on-error: true
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          APPIMAGE_EXTRACT_AND_RUN: 1
          ARCH: x86_64
          NO_STRIP: true
          # The reason the AppImage failed for five runs.
          #
          # `libfbclient.so.2` has a DT_NEEDED on `libtomcrypt.so.1`,
          # and Firebird ships both in its own `lib/` — which the bundle
          # already carries. linuxdeploy walks every shared object in
          # the AppDir and resolves its dependencies through the system
          # linker, which does not search a private directory, so it
          # reported "Could not find dependency: libtomcrypt.so.1" for a
          # file sitting a few directories away.
          #
          # .deb and .rpm do no such walk, which is why only the
          # AppImage ever failed.
          LD_LIBRARY_PATH: ${{ github.workspace }}/plamenix-desktop/resources/fbclient/v50/lib
        with:
          projectPath: plamenix-desktop
          tagName: ${{ inputs.tag || github.ref_name }}
          releaseName: 'Plamenix ${{ inputs.tag || github.ref_name }}'
          releaseDraft: true
          prerelease: true
          args: --bundles appimage --verbose

